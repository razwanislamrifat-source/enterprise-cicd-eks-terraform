# Single Source of Truth for Versions
# This file is used by Terraform, Maven, Docker, and Kustomize

# Java & Build
java_version=17
maven_version=3.9.4
spring_boot_version=3.3.5

# Kubernetes & EKS
kubernetes_version=1.29
eks_version=1.29

# Application
app_version=2.0.0
app_name=advanced-cicd-app
docker_image=razwanff/advanced-cicd-app

# AWS Infrastructure
aws_region=us-east-1
instance_type=t3.medium
node_group_instance_type=t3.medium
node_group_desired_size=2
node_group_max_size=3
node_group_min_size=1

# Container Images
builder_image=maven:3.9.4-amazoncorretto-17
runtime_image=amazoncorretto:17-alpine

# Monitoring
prometheus_version=2.50.0
grafana_version=10.2.0

# Security Tools
trivy_version=0.50.0
syft_version=0.99.0
cosign_version=2.2.0