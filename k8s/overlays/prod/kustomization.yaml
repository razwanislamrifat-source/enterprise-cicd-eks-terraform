apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: advanced-cicd

bases:
  - ../../base

commonLabels:
  environment: prod

images:
  - name: advanced-cicd-app
    newTag: "2.0.0"

replicas:
  - name: advanced-cicd-app
    count: 3

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: advanced-cicd-app
        namespace: advanced-cicd
      spec:
        template:
          spec:
            containers:
              - name: advanced-cicd-app
                resources:
                  limits:
                    cpu: "1000m"
                    memory: "1Gi"
                  requests:
                    cpu: "500m"
                    memory: "512Mi"
    target:
      kind: Deployment
      name: advanced-cicd-app

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: advanced-cicd-app-hpa
        namespace: advanced-cicd
      spec:
        minReplicas: 3
        maxReplicas: 20
    target:
      kind: HorizontalPodAutoscaler
      name: advanced-cicd-app-hpa