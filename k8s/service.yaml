apiVersion: v1
kind: Service
metadata:
  name: advanced-cicd-app
  namespace: advanced-cicd
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
    # Internal access only; use ingress or port-forward for external access
spec:
  type: ClusterIP
  selector:
    app: advanced-cicd-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
