# Option A: Kubernetes ExternalSecrets (recommended for production)
# 1. Install External Secrets Operator (https://external-secrets.io/)
# 2. Create a SecretStore pointing to your secret manager (AWS Secrets Manager, Vault, etc.)
# 3. Create an ExternalSecret resource:
# ---
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: dockercred-external
#   namespace: advanced-cicd
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     kind: SecretStore
#     name: aws-secrets-manager
#   target:
#     name: dockercred
#     creationPolicy: Owner
#   data:
#   - secretKey: .dockerconfigjson
#     remoteRef:
#       key: dockerhub/config
#       property: config
# ---

# Option B: SealedSecrets (recommended for GitOps / sealed encryption)
# 1. Install kubeseal (https://github.com/bitnami-labs/sealed-secrets)
# 2. Encrypt your secret locally:
#    kubectl create secret docker-registry dockercred \
#      --docker-server=https://index.docker.io/v1/ \
#      --docker-username=razwanff \
#      --docker-password=<TOKEN> \
#      --dry-run=client -o yaml | kubeseal --format yaml > k8s/sealed-secret.yaml
# 3. Commit only sealed-secret.yaml; apply with `kubectl apply -f k8s/sealed-secret.yaml`

# Option C: Manual creation (temporary / local only — do not commit raw data)
