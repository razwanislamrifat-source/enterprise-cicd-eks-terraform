# PURGING THE OLD SECRET FROM GIT HISTORY:
# This file previously contained a decodable base64 DockerHub credential.
# Rotate the exposed password/token immediately.
# To purge the secret from Git history (use git-filter-repo or BFG Repo-Cleaner):
#
# Using git-filter-repo:
#   git filter-repo --blob-callback '
#     if blob.data.startswith(b"apiVersion: v1\nkind: Secret"):
#       blob.skip()
#   '
# Or use BFG:
#   java -jar bfg.jar --delete-files "k8s/secret.yaml" .
