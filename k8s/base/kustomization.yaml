apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: advanced-cicd

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - secret.yaml

commonLabels:
  app: advanced-cicd-app
  managed-by: kustomize

images:
  - name: advanced-cicd-app
    newTag: "2.0.0"

replicas:
  - name: advanced-cicd-app
    count: 2