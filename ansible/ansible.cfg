[defaults]
inventory = inventory.ini
remote_user = ec2-user
private_key_file = ~/.ssh/advanced-cicd.pem
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null