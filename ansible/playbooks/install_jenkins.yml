---
- name: Install Jenkins on Jenkins Master with JCasC
  hosts: jenkins_master
  become: true
  gather_facts: true
  vars:
    jenkins_casc_url: "https://raw.githubusercontent.com/razwanislamrifat-source/enterprise-cicd-pipeline/main/jenkins/casc.yaml"
    jenkins_home: "/var/lib/jenkins"

  tasks:
    - name: Install Java and Jenkins
      ansible.builtin.yum:
        name:
          - java-17-amazon-corretto
          - firewalld
          - git
          - curl
        state: present

    - name: Configure Jenkins repository
      block:
        - name: Add Jenkins yum repository
          ansible.builtin.get_url:
            url: https://pkg.jenkins.io/redhat-stable/jenkins.repo
            dest: /etc/yum.repos.d/jenkins.repo
            mode: '0644'

        - name: Import Jenkins GPG key
          ansible.builtin.rpm_key:
            state: present
            key: https://pkg.jenkins.io/redhat-stable/jenkins.io-2023.key

    - name: Install Jenkins
      ansible.builtin.yum:
        name: jenkins
        state: present

    - name: Create JCasC configuration directory
      ansible.builtin.file:
        path: "{{ jenkins_home }}/casc_configs"
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Download JCasC configuration
      ansible.builtin.get_url:
        url: "{{ jenkins_casc_url }}"
        dest: "{{ jenkins_home }}/casc_configs/casc.yaml"
        mode: '0644'
        owner: jenkins
        group: jenkins
      register: casc_download

    - name: Configure Jenkins for JCasC
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/jenkins
        regexp: '^CASC_JENKINS_CONFIG='
        line: 'CASC_JENKINS_CONFIG={{ jenkins_home }}/casc_configs/casc.yaml'
        state: present
      notify: restart jenkins

    - name: Ensure Jenkins Java options include JCasC plugin
      ansible.builtin.lineinfile:
        path: /etc/sysconfig/jenkins
        regexp: '^JENKINS_JAVA_OPTIONS='
        line: 'JENKINS_JAVA_OPTIONS="-Djenkins.install.runSetupWizard=false -Dcasc.jenkins.config={{ jenkins_home }}/casc_configs/casc.yaml"'
        state: present
      notify: restart jenkins

    - name: Manage firewalld service
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Configure firewall for Jenkins
      ansible.posix.firewalld:
        port: 8080/tcp
        permanent: true
        state: enabled
        immediate: true

    - name: Start Jenkins service
      ansible.builtin.service:
        name: jenkins
        state: started
        enabled: true

    - name: Wait for Jenkins startup
      ansible.builtin.wait_for:
        port: 8080
        timeout: 300

    - name: Verify JCasC configuration loaded
      ansible.builtin.uri:
        url: http://localhost:8080/configuration-as-code
        status_code: 200
      register: casc_check
      retries: 10
      delay: 30
      until: casc_check.status == 200

  handlers:
    - name: restart jenkins
      ansible.builtin.service:
        name: jenkins
        state: restarted